<div class="module-resource-detail">
    <resource-detail :model="{&quot;module&quot;:{&quot;resourceBaseUrl&quot;:{&quot;href&quot;:&quot;/resources&quot;,&quot;target&quot;:&quot;_self&quot;,&quot;text&quot;:&quot;&quot;},&quot;topicLabel&quot;:&quot;Topics&quot;,&quot;shareLabel&quot;:&quot;Share this&quot;,&quot;pressReleaseFooterDescription&quot;:&quot;\u003Ch2\u003EAbout PhRMA\u003C/h2\u003E\r\n\u003Cp\u003EThe Pharmaceutical Research and Manufacturers of America (PhRMA) represents the country\u0026rsquo;s leading innovative biopharmaceutical research companies, which are laser focused on developing innovative medicines that transform lives and create a healthier world. Together, we are fighting for solutions to ensure patients can access and afford medicines that prevent, treat and cure disease. Over the last decade, PhRMA member companies have invested more than $800 billion in the search for new treatments and cures, and they support nearly five million jobs in the United States.\u003C/p\u003E\r\n\u003Ch2\u003EConnect with PhRMA\u003C/h2\u003E\r\n\u003Cp\u003EFor information on how innovative medicines save lives, please visit:\u0026nbsp;\u0026nbsp;\u003Cbr\u003E\u003Ca id=\u0022mainContentJump\u0022 href=\u0022/\u0022 target=\u0022\u0022\u003Ewww.PhRMA.org\u003C/a\u003E\u003Cbr\u003E\u003Ca target=\u0022_blank\u0022 href=\u0022https://votersforcures.org/\u0022 rel=\u0022noopener noreferrer\u0022\u003Ewww.VotersforCures.org\u003C/a\u003E\u003Cbr\u003E\u003Ca href=\u0022https://americasmedicines.com/\u0022\u003Ewww.AmericasMedicines.com\u003C/a\u003E\u003Cbr\u003E\u003Ca target=\u0022_blank\u0022 href=\u0022http://www.facebook.com/PhRMA\u0022 rel=\u0022noopener noreferrer\u0022\u003Ewww.Facebook.com/PhRMA\u0026nbsp;\u003C/a\u003E\u003Cbr\u003E\u003Ca target=\u0022_blank\u0022 href=\u0022https://x.com/PhRMA\u0022 rel=\u0022noopener noreferrer\u0022\u003Ewww.X.com/PhRMA\u0026nbsp;\u003C/a\u003E\u003C/p\u003E\r\n\u003Cp\u003E\u003C/p\u003E\r\n\u003Cp\u003E\u003C/p\u003E\r\n\u003Cp\u003E\u003C/p\u003E&quot;,&quot;pressReleaseFooterDescriptionNew&quot;:&quot;\u003Ch2\u003EAbout PhRMA\u003C/h2\u003E\r\n\u003Cp\u003EThe Pharmaceutical Research and Manufacturers of America (PhRMA) represents the country\u0026rsquo;s leading innovative biopharmaceutical research companies, which are focused on developing innovative medicines that transform lives and create a healthier world. Together, we are fighting for solutions to ensure patients can access and afford medicines that prevent, treat and cure disease. PhRMA member companies have invested more than $850 billion in the search for new treatments and cures over the last decade, supporting nearly five million jobs in the United States.\u003C/p\u003E\r\n\u003Ch2\u003EConnect with PhRMA\u003C/h2\u003E\r\n\u003Cp\u003EFor information on how innovative medicines save lives, please visit:\u0026nbsp;\u0026nbsp;\u003Cbr\u003E\u003Ca id=\u0022mainContentJump\u0022 href=\u0022/\u0022 target=\u0022\u0022\u003Ewww.PhRMA.org\u003C/a\u003E\u003Cbr\u003E\u003Ca href=\u0022https://innovation.org/\u0022 title=\u0022\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003Ewww.Innovation.org\u003C/a\u003E\u003Cbr\u003E\u003Ca target=\u0022_blank\u0022 href=\u0022https://votersforcures.org/\u0022 rel=\u0022noopener noreferrer\u0022\u003Ewww.VotersforCures.org\u003C/a\u003E\u003Cbr\u003E\u003Ca href=\u0022https://americasmedicines.com/\u0022\u003Ewww.AmericasMedicines.com\u003C/a\u003E\u003Cbr\u003E\u003Ca href=\u0022https://www.linkedin.com/company/phrma\u0022 title=\u0022\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003Ewww.LinkedIn.com/Company/PhRMA\u003C/a\u003E\u003Cbr\u003E\u003Ca target=\u0022_blank\u0022 href=\u0022https://x.com/PhRMA\u0022 rel=\u0022noopener noreferrer\u0022\u003Ewww.X.com/PhRMA\u0026nbsp;\u003C/a\u003E\u003C/p\u003E\r\n\u003Cp\u003E\u003C/p\u003E\r\n\u003Cp\u003E\u003C/p\u003E\r\n\u003Cp\u003E\u003C/p\u003E&quot;,&quot;heroLeftDecorationImage&quot;:{&quot;label&quot;:null,&quot;url&quot;:&quot;https://cdn.aglty.io/phrma/test/menu-circle.png&quot;,&quot;target&quot;:null,&quot;pixelHeight&quot;:&quot;76&quot;,&quot;pixelWidth&quot;:&quot;259&quot;,&quot;filesize&quot;:2041,&quot;height&quot;:76,&quot;width&quot;:259},&quot;heroRightDecorationImage&quot;:{&quot;label&quot;:null,&quot;url&quot;:&quot;https://cdn.aglty.io/phrma/test/corner-decoration@3x.png&quot;,&quot;target&quot;:null,&quot;pixelHeight&quot;:&quot;312&quot;,&quot;pixelWidth&quot;:&quot;1005&quot;,&quot;filesize&quot;:7162,&quot;height&quot;:312,&quot;width&quot;:1005},&quot;heroUseGradient&quot;:false,&quot;heroBackgroundColorHex&quot;:&quot;#0D1620&quot;,&quot;heroBackgroundColorGradientEndHex&quot;:&quot;&quot;,&quot;relatedResourcesLabel&quot;:&quot;Related Resources&quot;,&quot;relatedResourcesUseGradient&quot;:false,&quot;relatedResourcesBackgroundColorHex&quot;:&quot;&quot;,&quot;relatedResourcesBackgroundColorGradientEndHex&quot;:&quot;&quot;,&quot;contentID&quot;:5978,&quot;properties&quot;:{&quot;state&quot;:2,&quot;modified&quot;:&quot;2026-02-16T19:03:12.07&quot;,&quot;versionID&quot;:52465,&quot;referenceName&quot;:&quot;resourcedetail_resourcedetai022ccf&quot;,&quot;definitionName&quot;:&quot;ResourceDetailModule&quot;,&quot;itemOrder&quot;:0},&quot;seo&quot;:null},&quot;resource&quot;:{&quot;subtitle&quot;:&quot;&quot;,&quot;body&quot;:&quot;\u003Cp\u003EIn October 2018, PhRMA\u0026rsquo;s Board of Directors adopted measures to enhance the PhRMA Guiding Principles on Direct to Consumer Advertisements about Prescription Medicines. The revised, voluntary Principles become effective on April 15, 2019 and include a new guiding principle stating that \u0026ldquo;[a]ll DTC television advertising that identifies a prescription medicine by name should include direction as to where patients can find information about the cost of the medicine, such as a company-developed website, including the list price and average, estimated or typical patient out-of-pocket costs, or other context about the potential cost of the medicine.\u0026rdquo;\u0026nbsp; The Principles also state that PhRMA will identify on its website all companies that voluntarily and independently commit to abide by the Principles as Signatories and will identify companies that complete, at the appropriate time, annual certifications that they have policies and procedures in place to foster compliance with the Principles.\u0026nbsp; The certifications must be signed by the companies\u0026rsquo; Chief Executive Officers and Chief Compliance Officers for their United States pharmaceutical business.\u003C/p\u003E\r\n\u003Cp\u003E\u003Ca href=\u0022/resources/certification-submission\u0022 title=\u0022\u0022 target=\u0022\u0022\u003ESUBMIT CERTIFICATIONS\u003C/a\u003E\u003C/p\u003E&quot;,&quot;relatedResources&quot;:[],&quot;detailImage&quot;:{&quot;label&quot;:&quot;Direct to Consumer Advertising Principles image&quot;,&quot;url&quot;:&quot;https://cdn.aglty.io/phrma/global/resources/import/teaser-images/Default_1000x775_guideline_2k.jpg&quot;,&quot;target&quot;:null,&quot;pixelHeight&quot;:&quot;1551&quot;,&quot;pixelWidth&quot;:&quot;2001&quot;,&quot;filesize&quot;:136052,&quot;height&quot;:1551,&quot;width&quot;:2001},&quot;attachments&quot;:[{&quot;label&quot;:&quot;READ THE DTC PRINCIPLES&quot;,&quot;url&quot;:&quot;https://cdn.aglty.io/phrma/global/resources/PhRMA_Guiding_Principles_2018.pdf&quot;,&quot;filesize&quot;:154801}],&quot;hideDate&quot;:false,&quot;videoID&quot;:&quot;&quot;,&quot;type&quot;:{&quot;title&quot;:&quot;Codes and Guidelines&quot;,&quot;slug&quot;:&quot;codes-and-guidelines&quot;,&quot;icon&quot;:null,&quot;contentID&quot;:3906,&quot;properties&quot;:{&quot;state&quot;:2,&quot;modified&quot;:&quot;2025-01-09T21:25:25.857&quot;,&quot;versionID&quot;:25714,&quot;referenceName&quot;:&quot;resourcetype&quot;,&quot;definitionName&quot;:&quot;Tag&quot;,&quot;itemOrder&quot;:1},&quot;seo&quot;:null},&quot;useNewPressReleaseFooter&quot;:false,&quot;titleTag&quot;:&qu
