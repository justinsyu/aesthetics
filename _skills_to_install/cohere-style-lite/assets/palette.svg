<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" font-family="Helvetica Neue, Inter, Arial, sans-serif">
  <rect width="700" height="220" fill="#FAF6F1"/>
  <text x="20" y="32" font-size="18" font-weight="700" fill="#D85A3F" letter-spacing="-0.5">Cohere-style-lite — palette</text>

  <!-- Swatch row -->
  <g transform="translate(20,55)">
    <!-- Primary coral -->
    <rect width="90" height="90" fill="#FF7759"/>
    <text x="0" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Primary coral</text>
    <text x="0" y="124" font-size="10" fill="#6B6B6B">#FF7759</text>

    <!-- Sub coral -->
    <rect x="100" width="90" height="90" fill="#D85A3F"/>
    <text x="100" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Sub-coral</text>
    <text x="100" y="124" font-size="10" fill="#6B6B6B">#D85A3F</text>

    <!-- Forest -->
    <rect x="200" width="90" height="90" fill="#39594D"/>
    <text x="200" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Forest accent</text>
    <text x="200" y="124" font-size="10" fill="#6B6B6B">#39594D</text>

    <!-- Ink -->
    <rect x="300" width="90" height="90" fill="#1A1A1A"/>
    <text x="300" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Deep ink</text>
    <text x="300" y="124" font-size="10" fill="#6B6B6B">#1A1A1A</text>

    <!-- Slate -->
    <rect x="400" width="90" height="90" fill="#6B6B6B"/>
    <text x="400" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Muted slate</text>
    <text x="400" y="124" font-size="10" fill="#6B6B6B">#6B6B6B</text>

    <!-- Cream -->
    <rect x="500" width="90" height="90" fill="#FAF6F1" stroke="#E8DFD3"/>
    <text x="500" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Warm cream BG</text>
    <text x="500" y="124" font-size="10" fill="#6B6B6B">#FAF6F1</text>

    <!-- Beige -->
    <rect x="600" width="90" height="90" fill="#E8DFD3"/>
    <text x="600" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Soft beige rule</text>
    <text x="600" y="124" font-size="10" fill="#6B6B6B">#E8DFD3</text>
  </g>

  <line x1="20" y1="200" x2="680" y2="200" stroke="#FF7759" stroke-width="1.5"/>
  <text x="20" y="216" font-size="9" fill="#6B6B6B">Helvetica Neue / Inter / Arial · tightened tracking on display sizes · cream backgrounds, never pure white</text>
</svg>
