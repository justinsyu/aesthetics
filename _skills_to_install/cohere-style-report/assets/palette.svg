<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" font-family="Georgia, 'Tiempos Text', Charter, serif">
  <rect width="700" height="220" fill="#FFFFFF"/>
  <text x="20" y="32" font-size="18" font-weight="700" fill="#8B2820" letter-spacing="-0.5">Cohere-style-report - palette</text>
  <text x="20" y="48" font-size="11" fill="#D85A3F" font-family="Helvetica Neue, Inter, Arial, sans-serif" letter-spacing="3">RESEARCH . INSIGHTS</text>

  <g transform="translate(20,70)">
    <rect width="90" height="90" fill="#8B2820"/>
    <text x="0" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Deep maroon</text>
    <text x="0" y="124" font-size="10" fill="#6B6B6B">#8B2820</text>

    <rect x="100" width="90" height="90" fill="#D85A3F"/>
    <text x="100" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Coral accent</text>
    <text x="100" y="124" font-size="10" fill="#6B6B6B">#D85A3F</text>

    <rect x="200" width="90" height="90" fill="#1A1A1A"/>
    <text x="200" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Deep ink</text>
    <text x="200" y="124" font-size="10" fill="#6B6B6B">#1A1A1A</text>

    <rect x="300" width="90" height="90" fill="#6B6B6B"/>
    <text x="300" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Muted slate</text>
    <text x="300" y="124" font-size="10" fill="#6B6B6B">#6B6B6B</text>

    <rect x="400" width="90" height="90" fill="#E8DFD3"/>
    <text x="400" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Soft beige</text>
    <text x="400" y="124" font-size="10" fill="#6B6B6B">#E8DFD3</text>

    <rect x="500" width="90" height="90" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="1"/>
    <text x="500" y="108" font-size="11" font-weight="700" fill="#1A1A1A">Page background</text>
    <text x="500" y="124" font-size="10" fill="#6B6B6B">#FFFFFF</text>
  </g>

  <line x1="20" y1="205" x2="680" y2="205" stroke="#D85A3F" stroke-width="2"/>
</svg>
