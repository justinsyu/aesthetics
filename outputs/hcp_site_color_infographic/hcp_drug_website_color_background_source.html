<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HCP drug website color infographic background</title>
  <style>
    body {
      margin: 0;
      background: #ddd4c3;
    }

    .sheet {
      width: 1200px;
      height: 2260px;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 8%, rgba(215, 255, 95, 0.34), transparent 360px),
        radial-gradient(circle at 88% 6%, rgba(184, 216, 255, 0.42), transparent 330px),
        radial-gradient(circle at 92% 94%, rgba(255, 184, 107, 0.25), transparent 360px),
        linear-gradient(180deg, #f8f2e8 0%, #eee5d5 100%);
    }

    @page {
      size: 1200px 2260px;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="sheet"></main>
</body>
</html>
