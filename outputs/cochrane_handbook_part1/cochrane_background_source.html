<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cochrane slide background source</title>
  <style>
    :root {
      --paper: #f6f1e8;
      --lime: #d7ff5f;
      --orange: #ffb86b;
      --blue: #b8d8ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); }
    .sheet {
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background:
        radial-gradient(circle at 6% 2%, rgba(215,255,95,0.34), transparent 34rem),
        radial-gradient(circle at 90% 8%, rgba(184,216,255,0.30), transparent 28rem),
        radial-gradient(circle at 86% 88%, rgba(255,184,107,0.18), transparent 28rem),
        var(--paper);
    }
    @page { size: 1600px 900px; margin: 0; }
  </style>
</head>
<body>
  <main class="sheet"></main>
</body>
</html>
