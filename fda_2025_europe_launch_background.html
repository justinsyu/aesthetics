<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FDA 2025 Europe launch infographic background</title>
  <style>
    body,
    *,
    *::before,
    *::after {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    html,
    body {
      margin: 0;
      width: 1600px;
      height: 2400px;
      overflow: hidden;
      background: #ebe4d6;
    }

    .sheet {
      position: relative;
      width: 1600px;
      height: 2400px;
      overflow: hidden;
      background:
        radial-gradient(circle at 7% 2%, rgba(215, 255, 95, 0.42), transparent 440px),
        radial-gradient(circle at 91% 4%, rgba(184, 216, 255, 0.42), transparent 420px),
        radial-gradient(circle at 8% 58%, rgba(255, 211, 224, 0.22), transparent 520px),
        radial-gradient(circle at 96% 82%, rgba(255, 184, 107, 0.30), transparent 560px),
        linear-gradient(135deg, #f7f0e4 0%, #efe7d8 100%);
    }

    .sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.20;
      background-image:
        linear-gradient(rgba(16, 18, 15, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 18, 15, 0.045) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    @page {
      size: 1600px 2400px;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="sheet"></main>
</body>
</html>
