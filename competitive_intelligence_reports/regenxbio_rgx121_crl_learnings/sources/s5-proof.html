<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; background: #eee8dc; font-family: Arial, sans-serif; }
    .bar { height: 42px; background: #1f2933; color: white; display: flex; align-items: center; gap: 14px; padding: 0 22px; font-size: 15px; }
    .url { color: #d7e8ff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .stage { position: relative; padding: 18px 0 50px 38px; }
    img { width: 1160px; height: auto; display: block; box-shadow: 0 4px 18px rgba(0,0,0,.18); background: white; }
    .box { position: absolute; left: 92px; top: 260px; width: 1050px; height: 440px; border: 6px solid #d62828; border-radius: 8px; box-sizing: border-box; pointer-events: none; }
    .label { position: absolute; left: 92px; top: 226px; background: #d62828; color: white; font-weight: 700; font-size: 18px; padding: 5px 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="bar"><strong>S5</strong><span>FDA accelerated-approval guidance: surrogate endpoint support</span><span class="url">https://www.fda.gov/media/184120/download</span></div>
  <div class="stage">
    <img src="s5-render.png" alt="FDA accelerated-approval guidance: surrogate endpoint support">
    <div class="label">S5</div>
    <div class="box"></div>
  </div>
</body>
</html>
